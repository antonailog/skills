<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<!-- ai-events-push 的海报模板：按城市分区，每场一张网站电脑版同款门票（票根宣传图 338×190 即 16:9｜正文日期钟点、名称、地点、主办方、介绍｜副券价格），
     背景是网站顶栏的七彩压淡。make_poster.py 填进刊头和城市分区，760 宽按 3 倍截图 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.1.1/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.1.1/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-qingke-huangyou@5.1.1/400.css">
<style>
@font-face { font-family: "Geist"; font-weight: 100 900; src: url("素材/geist-latin-wght-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #2B2A26; --ink-2: #5F5E5B; --ink-3: #8A8884; --ink-4: #B3B1AC; --line-2: #DCDBD8; --due: #D44C47; --due-bg: #FDEBEC;
  --rainbow: #F9AFCB 0%, #FFC59A 18%, #FFE88A 36%, #B3EBC4 54%, #A6DDF2 70%, #B5C7FA 85%, #D8BBF6 100%;
  --sans: "Geist", "Noto Sans SC", "PingFang SC", sans-serif; }
body { width: 760px; position: relative; color: var(--ink); font-family: var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  /* 整页铺一层很淡的斜向七彩；顶部另有一段网站顶栏同款横向七彩（body::before），往下渐隐 */
  background: linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.80)), linear-gradient(160deg, var(--rainbow)); }
body::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 420px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,.78)), linear-gradient(90deg, var(--rainbow));
  -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent); }
body::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .37  0 0 0 0 .33  0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.hero, .city, .foot { position: relative; z-index: 1; }

/* 刊头：和网站顶栏同一套——左边标题，右边翻牌场数 */
.hero { padding: 24px 22px 10px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; font: 700 12.5px/1 var(--sans); color: var(--ink-2); letter-spacing: .04em; }
.brand b { font: 400 16px/1 "ZCOOL QingKe HuangYou", var(--sans); color: var(--ink); letter-spacing: .04em; }
.hero-row { margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.title { font: 400 54px/1 "ZCOOL QingKe HuangYou", var(--sans); letter-spacing: .03em; }
.stat { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; }
.tile { display: grid; place-items: center; width: 34px; height: 44px; border-radius: 7px; background: #fff; box-shadow: 0 0 0 1px var(--line-2), 0 1px 2px rgba(15,15,15,.08); font: 700 28px/1 var(--sans); }
.stat small { font: 500 13px/1 var(--sans); color: var(--ink-3); }
.sub { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; font: 700 13.5px/1 var(--sans); color: var(--ink-2); }
.sub b { font-weight: 800; color: var(--ink); letter-spacing: .06em; }
.sub i { font-style: normal; color: var(--c); }

/* 城市分区 */
.city { padding: 18px 18px 4px; }
.city-h { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 12px; }
.city-name { font: 900 30px/1 var(--sans); letter-spacing: .04em; color: var(--c); }
.city-n { font: 700 13px/1 var(--sans); color: var(--ink-2); }
.tickets { display: flex; flex-direction: column; gap: 12px; }

/* 门票：网站同款——票根（宣传图）｜正文｜副券（价格），两道齿孔撕线，四角缺口 */
.ticket { --r: 8px; filter: drop-shadow(0 0 .6px rgba(15,15,15,.34)) drop-shadow(0 2px 6px rgba(15,15,15,.06)); }
.tk { display: grid; grid-template-columns: 338px minmax(0, 1fr) 46px; min-height: 190px; }   /* 网站电脑版门票的比例：宣传图 338×190 = 16:9（11-02 用户选 A） */
.seg { position: relative; min-width: 0; overflow: hidden; }
.body, .tail { background-color: #fff; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.stub { border-radius: 12px 0 0 12px; background: #F7F7F5;
  -webkit-mask: radial-gradient(circle var(--r) at 100% 0, transparent calc(var(--r) - .5px), #000 var(--r)), radial-gradient(circle var(--r) at 100% 100%, transparent calc(var(--r) - .5px), #000 var(--r)); -webkit-mask-composite: source-in; }
.cover-bg { position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover; filter: blur(14px) saturate(1.15); opacity: .9; }
.cover-fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cover-ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.body { padding: 11px 12px 12px 16px;
  -webkit-mask: radial-gradient(circle var(--r) at 0 0, transparent calc(var(--r) - .5px), #000 var(--r)), radial-gradient(circle var(--r) at 0 100%, transparent calc(var(--r) - .5px), #000 var(--r)), radial-gradient(circle var(--r) at 100% 0, transparent calc(var(--r) - .5px), #000 var(--r)), radial-gradient(circle var(--r) at 100% 100%, transparent calc(var(--r) - .5px), #000 var(--r)); -webkit-mask-composite: source-in; }
.tail { display: flex; align-items: center; justify-content: center; border-radius: 0 12px 12px 0; background-color: color-mix(in srgb, var(--c-bg) 55%, #fff);
  -webkit-mask: radial-gradient(circle var(--r) at 0 0, transparent calc(var(--r) - .5px), #000 var(--r)), radial-gradient(circle var(--r) at 0 100%, transparent calc(var(--r) - .5px), #000 var(--r)); -webkit-mask-composite: source-in; }
.body::before, .tail::before { content: ""; position: absolute; left: 0; top: calc(var(--r) + 5px); bottom: calc(var(--r) + 5px); width: 5px; background: radial-gradient(circle, var(--line-2) 1.4px, transparent 1.8px) 50% 0 / 5px 7px repeat-y; }
.price { writing-mode: vertical-rl; font: 800 17px/1 var(--sans); letter-spacing: .08em; color: var(--ink); white-space: nowrap; }
.price.dim { font-size: 12.5px; font-weight: 700; color: var(--ink-3); }

/* 正文：第一行日期钟点（日期用城市色），再是名称、地点、主办方、理由 */
.r1 { display: flex; align-items: center; gap: 8px; font: 600 12.5px/20px var(--sans); color: var(--ink-2); white-space: nowrap; }
.r1 b { font-weight: 800; font-size: 13.5px; color: var(--c); }
.due { display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 4px; background: var(--due-bg); font: 700 11.5px/1 var(--sans); color: var(--due); }
.name { margin-top: 3px; font: 900 15.5px/1.36 var(--sans); }
.meta { margin-top: 5px; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 5px; font: 500 12px/1.45 "PingFang SC", var(--sans); color: var(--ink-2); }
.meta + .meta { margin-top: 1px; }
.meta svg { width: 12px; height: 12px; margin-top: 2.5px; color: var(--ink-4); }
.venue-hl { font-weight: 800; color: var(--c); }
.why { margin-top: 7px; padding-top: 7px; border-top: 1px solid #F0EEEA; font: 400 12.5px/1.55 "PingFang SC", var(--sans); color: var(--ink); }

.foot { display: flex; align-items: center; gap: 14px; margin: 18px 18px 24px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.72); box-shadow: 0 0 0 1px rgba(31,30,27,.07); }
#qr { flex: none; width: 72px; height: 72px; }
#qr svg { display: block; width: 100%; height: 100%; }
.foot p:first-child { font: 900 15px/1.3 var(--sans); }
.foot p:last-child { margin-top: 4px; font: 600 12px/1.3 var(--sans); color: var(--ink-3); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></symbol>
</svg>

{{HERO}}

{{SECTIONS}}

<footer class="foot">
  <div id="qr"></div>
  <div><p>每天更新的国内 AI 活动日历</p><p>antonailog.com/more/ai-events</p></div>
</footer>
<script src="素材/qrcode.min.js"></script>
<script>const q = qrcode(0, 'M'); q.addData('https://antonailog.com/more/ai-events/'); q.make(); document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });</script>
</body>
</html>
